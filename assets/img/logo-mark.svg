<svg viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lifetime Truegreen logo mark">
  <defs>
    <linearGradient id="tealGrad" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#2f8d99"/>
      <stop offset="1" stop-color="#0D5B66"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0.1" y1="0.1" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8BC34A"/>
      <stop offset="0.5" stop-color="#4CAF50"/>
      <stop offset="1" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>

  <!-- Teal water / flame swoosh -->
  <path fill="url(#tealGrad)"
        d="M130 26C116 66 90 102 80 148c-7 34 0 76 38 100-18-26-22-52-14-88 8-44 20-86 30-118 -1-6-3-12-4-16Z"/>
  <!-- Inner teal tail (double-line detail) -->
  <path fill="url(#tealGrad)"
        d="M104 250c-20-20-26-48-19-80 6-30 18-58 30-86-18 26-30 54-35 84-5 30 3 60 24 82Z"/>

  <!-- Green leaf -->
  <path fill="url(#leafGrad)"
        d="M146 44c30 30 54 68 50 112-3 36-24 74-56 94-8-30-8-64 0-98 8-32 6-72 6-108Z"/>

  <!-- White leaf veins (midrib + herringbone) -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M143 58C141 112 139 172 139 242"/>
    <path d="M141 94l30-12M140 126l34-9M139 158l30-5M139 188l24-2"/>
    <path d="M141 104l-18-6M140 136l-16-3M139 168l-14-1"/>
  </g>
</svg>
